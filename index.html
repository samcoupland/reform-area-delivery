<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaflet Delivery Areas</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --reform: #00bed6;
    --reform-dark: #009ab0;
    --reform-light: #e0f9fc;
    --reform-mid: #b3eef5;
    --ink: #0d1f26;
    --ink-mid: #2c4a54;
    --ink-light: #6b8f9a;
    --white: #ffffff;
    --grey-light: #f4fbfc;
    --grey-border: #d0eef2;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--grey-light);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ===== NAV ===== */
  .screen-nav {
    background: var(--ink);
    padding: 0 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--white);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .nav-brand .dot {
    width: 10px; height: 10px;
    background: var(--reform);
    border-radius: 50%;
  }

  .nav-actions {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 18px;
    height: 36px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-primary { background: var(--reform); color: var(--ink); }
  .btn-primary:hover { background: var(--reform-dark); color: var(--white); }

  .btn-ghost {
    background: transparent;
    color: var(--reform);
    border: 1.5px solid var(--reform);
  }
  .btn-ghost:hover { background: var(--reform); color: var(--ink); }

  .btn-danger {
    background: transparent;
    color: #ff7a5c;
    border: 1.5px solid #ff7a5c;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 18px;
    height: 36px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-danger:hover { background: #ff7a5c; color: white; }

  .btn-sm { height: 28px; padding: 0 10px; font-size: 0.75rem; }

  /* ===== PAGES ===== */
  .page { display: none; }
  .page.active { display: block; }

  /* ===== CONTENTS PAGE ===== */
  .contents-hero {
    background: var(--ink);
    padding: 3rem 2rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .contents-hero::before {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 4px;
    background: var(--reform);
  }

  .contents-hero h1 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: var(--white);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }

  .contents-hero h1 span { color: var(--reform); }

  .contents-hero p {
    margin-top: 0.75rem;
    color: var(--ink-light);
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 0.04em;
  }

  .contents-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
    margin-top: 2rem;
  }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  .area-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1rem;
  }

  .area-card {
    background: var(--white);
    border: 1.5px solid var(--grey-border);
    border-radius: 8px;
    padding: 1.25rem 1.25rem 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .area-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--reform);
    transform: scaleY(0);
    transition: transform 0.2s ease;
    transform-origin: bottom;
  }

  .area-card:hover {
    border-color: var(--reform);
    box-shadow: 0 4px 16px rgba(0,190,214,0.15);
    transform: translateY(-2px);
  }

  .area-card:hover::before { transform: scaleY(1); }

  .area-polling-code {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.7rem;
    color: var(--reform);
    line-height: 1;
    margin-bottom: 0.3rem;
    letter-spacing: 0.04em;
  }

  .area-polling-code.empty {
    font-size: 1rem;
    color: var(--reform-mid);
  }

  .area-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--ink);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    margin-bottom: 0.15rem;
  }

  /* Ward in smaller condensed font below title */
  .area-ward-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    color: var(--ink-light);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .area-meta {
    font-size: 0.8rem;
    color: var(--ink-light);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 20px;
  }

  .status-done    { background: #d4f5e9; color: #0d7a4e; }
  .status-partial { background: #fff3cd; color: #856404; }
  .status-pending { background: var(--reform-light); color: var(--reform-dark); }

  .add-area-card {
    background: transparent;
    border: 2px dashed var(--grey-border);
    border-radius: 8px;
    padding: 1.25rem;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 120px;
    color: var(--ink-light);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .add-area-card:hover {
    border-color: var(--reform);
    color: var(--reform);
    background: var(--reform-light);
  }

  /* ===== AREA DETAIL PAGE ===== */
  .area-detail-header {
    background: var(--ink);
    padding: 1.25rem 2rem 1.5rem;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--reform);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 7px 16px;
    margin-bottom: 0.75rem;
    transition: all 0.15s ease;
  }

  .back-btn:hover { background: var(--reform-dark); color: var(--white); }

  .area-detail-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    color: var(--white);
    text-transform: uppercase;
    line-height: 1;
  }

  .area-detail-title span { color: var(--reform); }

  .area-detail-body {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 1.5rem;
    align-items: start;
  }

  @media (max-width: 700px) {
    .area-detail-body { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--white);
    border: 1.5px solid var(--grey-border);
    border-radius: 8px;
    overflow: hidden;
  }

  .card-header {
    background: var(--reform-light);
    padding: 0.75rem 1.25rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1.5px solid var(--grey-border);
  }

  .card-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--reform-dark);
  }

  .card-body { padding: 1.25rem; }

  .map-image {
    width: 100%;
    border-radius: 6px;
    display: block;
    max-height: 280px;
    object-fit: cover;
  }

  .map-placeholder {
    background: linear-gradient(135deg, var(--reform-light) 0%, #c8f0f5 100%);
    border-radius: 6px;
    height: 180px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: var(--reform-dark);
    font-size: 0.85rem;
    text-align: center;
    padding: 1rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .map-placeholder svg { opacity: 0.5; }

  .map-note {
    font-size: 0.75rem;
    color: var(--ink-light);
    margin-top: 0.4rem;
    font-family: 'Barlow', sans-serif;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
  }

  .map-upload-row {
    margin-top: 0.75rem;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }

  .map-upload-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--reform-dark);
    background: var(--reform-light);
    border: 1.5px solid var(--reform);
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .map-upload-label:hover { background: var(--reform); color: var(--ink); }
  .map-upload-label input[type="file"] { display: none; }

  .map-remove-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #ff7a5c;
    background: transparent;
    border: 1.5px solid #ff7a5c;
    border-radius: 4px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .map-remove-btn:hover { background: #ff7a5c; color: white; }

  /* Streets */
  .street-list { list-style: none; }

  .street-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0.6rem 0;
    border-bottom: 1px solid var(--grey-border);
    font-size: 0.9rem;
  }

  .street-item:last-child { border-bottom: none; }

  .street-check {
    width: 18px; height: 18px;
    border: 2px solid var(--grey-border);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .street-check.checked {
    background: var(--reform);
    border-color: var(--reform);
  }

  .street-check.checked::after {
    content: '✓';
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
  }

  .street-name { flex: 1; color: var(--ink); }
  .street-name.done { text-decoration: line-through; color: var(--ink-light); }

  .street-notes { font-size: 0.75rem; color: var(--ink-light); font-style: italic; }

  .add-street-row {
    display: flex;
    gap: 8px;
    margin-top: 1rem;
  }

  .input-field {
    flex: 1;
    padding: 7px 12px;
    border: 1.5px solid var(--grey-border);
    border-radius: 4px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.85rem;
    color: var(--ink);
    background: var(--white);
    transition: border-color 0.15s;
  }

  .input-field:focus { outline: none; border-color: var(--reform); }

  .progress-bar-wrap {
    background: var(--grey-border);
    border-radius: 20px;
    height: 8px;
    margin: 0.75rem 0 0.5rem;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--reform);
    border-radius: 20px;
    transition: width 0.3s ease;
  }

  .progress-label { font-size: 0.78rem; color: var(--ink-light); font-weight: 500; }

  /* ===== MODAL ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(13,31,38,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--white);
    border-radius: 10px;
    padding: 2rem;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }

  .modal h2 {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.4rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 1.25rem;
  }

  .modal h2 span { color: var(--reform); }

  .form-group { margin-bottom: 1rem; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1rem;
  }

  .form-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
    margin-bottom: 5px;
  }

  .form-input {
    width: 100%;
    padding: 9px 12px;
    border: 1.5px solid var(--grey-border);
    border-radius: 5px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.9rem;
    color: var(--ink);
    transition: border-color 0.15s;
  }

  .form-input:focus { outline: none; border-color: var(--reform); }

  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 1.5rem;
  }

  .btn-cancel {
    background: none;
    border: 1.5px solid var(--grey-border);
    color: var(--ink-light);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0 18px;
    height: 36px;
    border-radius: 4px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
  }
  .btn-cancel:hover { border-color: var(--ink-light); color: var(--ink); }

  /* ===== PRINT ===== */
  @media print {
    body { background: white; }
    .screen-nav, .add-area-card, .add-street-row,
    .nav-actions, .back-btn, .btn, .area-actions,
    .map-upload-row { display: none !important; }
    .page { display: block !important; }
    .contents-page { page-break-after: always; }
    .area-page { page-break-before: always; }
    .contents-hero { padding: 1.5rem 1rem; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .area-detail-body { grid-template-columns: 1fr 280px; padding: 1rem; }
    .area-card { break-inside: avoid; }
    @page { size: A4; margin: 12mm 14mm; }
  }
</style>
</head>
<body>

<nav class="screen-nav">
  <div class="nav-brand">
    <div class="dot"></div>
    Leaflet Delivery
  </div>
  <div class="nav-actions">
    <button class="btn btn-ghost" id="export-btn" onclick="exportAllPDF()">⬇ Export PDF</button>
    <button class="btn btn-primary" onclick="openModal()">+ Add Area</button>
  </div>
</nav>

<!-- CONTENTS PAGE -->
<div id="page-contents" class="page active contents-page">
  <div class="contents-hero">
    <h1>Delivery <span>Area</span> Index</h1>
    <p>Leaflet distribution schedule &amp; street tracker</p>
  </div>
  <div class="contents-wrapper">
    <div class="section-header">
      <span class="section-title">All Areas</span>
      <span id="area-count" class="section-title">0 areas</span>
    </div>
    <div class="area-grid" id="area-grid"></div>
  </div>
</div>

<!-- AREA DETAIL PAGE -->
<div id="page-area" class="page area-page">
  <div class="area-detail-header">
    <div>
      <button class="back-btn" onclick="navigateToContents()">← Back to Index</button>
      <div class="area-detail-title" id="detail-title"></div>
      <div style="color:var(--ink-light);font-size:0.85rem;margin-top:4px;" id="detail-subtitle"></div>
    </div>
    <div class="area-actions" style="display:flex;gap:8px;align-items:center;margin-top:1.5rem;">
      <button class="btn btn-ghost" onclick="window.print()">🖨 Print</button>
      <button class="btn btn-danger" onclick="deleteCurrentArea()">Delete Area</button>
    </div>
  </div>
  <div class="area-detail-body" id="area-detail-body"></div>
</div>

<!-- ADD AREA MODAL -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Add <span>New Area</span></h2>
    <div class="form-group">
      <label class="form-label">Area Name / Description</label>
      <input class="form-input" id="input-name" placeholder="e.g. North High Street" />
    </div>
    <div class="form-row">
      <div>
        <label class="form-label">Ward</label>
        <input class="form-input" id="input-ward" placeholder="e.g. Riverside" />
      </div>
      <div>
        <label class="form-label">Polling Code</label>
        <input class="form-input" id="input-polling" placeholder="e.g. RV-4A" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" id="input-notes" placeholder="e.g. Near the park, avoid steep hill" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addArea()">Add Area</button>
    </div>
  </div>
</div>

<script>
// ===== STATE =====
let areas = JSON.parse(localStorage.getItem('leaflet_areas') || '[]');
let currentAreaId = null;

function save() {
  localStorage.setItem('leaflet_areas', JSON.stringify(areas));
}

// ===== NAVIGATION =====
function navigateToContents() {
  history.pushState(null, '', window.location.pathname);
  showContentsView();
}

function navigateToArea(id) {
  history.pushState({ areaId: id }, '', '#area/' + id);
  showAreaView(id);
}

window.addEventListener('popstate', (e) => {
  if (e.state && e.state.areaId) {
    showAreaView(e.state.areaId);
  } else {
    showContentsView();
  }
});

// ===== VIEW SWITCHERS =====
function showContentsView() {
  currentAreaId = null;
  document.getElementById('page-contents').classList.add('active');
  document.getElementById('page-area').classList.remove('active');
  renderContents();
}

function showAreaView(id) {
  const area = areas.find(a => a.id === id);
  if (!area) { navigateToContents(); return; }
  currentAreaId = id;
  document.getElementById('page-contents').classList.remove('active');
  document.getElementById('page-area').classList.add('active');
  renderAreaDetail(id);
}

// ===== RENDER CONTENTS =====
function renderContents() {
  const grid = document.getElementById('area-grid');
  const count = document.getElementById('area-count');
  count.textContent = areas.length + ' area' + (areas.length !== 1 ? 's' : '');
  grid.innerHTML = '';

  areas.forEach((area) => {
    const done  = area.streets.filter(s => s.done).length;
    const total = area.streets.length;
    const pct   = total ? Math.round((done / total) * 100) : 0;
    const statusClass = pct === 100 ? 'status-done' : pct > 0 ? 'status-partial' : 'status-pending';
    const statusLabel = pct === 100 ? '✓ Complete' : pct > 0 ? `${pct}% Done` : 'Pending';

    const card = document.createElement('div');
    card.className = 'area-card';

    const areaId = area.id;
    card.addEventListener('click', () => navigateToArea(areaId));

    card.innerHTML = `
      <div class="area-polling-code ${area.pollingCode ? '' : 'empty'}">${area.pollingCode || 'No Code'}</div>
      <div class="area-name">${area.name}</div>
      ${area.ward ? `<div class="area-ward-label">${area.ward}</div>` : ''}
      <div class="area-meta">
        <span>${total} street${total !== 1 ? 's' : ''}</span>
        <span class="status-pill ${statusClass}">${statusLabel}</span>
      </div>
    `;
    grid.appendChild(card);
  });

  const addCard = document.createElement('div');
  addCard.className = 'add-area-card';
  addCard.addEventListener('click', openModal);
  addCard.innerHTML = `
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </svg>
    Add New Area
  `;
  grid.appendChild(addCard);
}

// ===== RENDER AREA DETAIL =====
function renderAreaDetail(id) {
  const area = areas.find(a => a.id === id);
  if (!area) return;

  const done  = area.streets.filter(s => s.done).length;
  const total = area.streets.length;
  const pct   = total ? Math.round((done / total) * 100) : 0;

  // Header
  document.getElementById('detail-title').innerHTML =
    `${area.pollingCode ? `<span style="color:var(--reform)">${area.pollingCode}</span> — ` : ''}${area.name}`;
  document.getElementById('detail-subtitle').textContent =
    [area.ward, area.notes].filter(Boolean).join(' — ');

  // Map HTML
  const mapHTML = buildMapHTML(area);

  // Full body render
  document.getElementById('area-detail-body').innerHTML = `
    <div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">Streets to Complete</span>
          <span class="progress-label" id="progress-count">${done}/${total} done</span>
        </div>
        <div class="card-body">
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="progress-bar" style="width:${pct}%"></div>
          </div>
          <p class="progress-label" id="progress-pct" style="margin-bottom:0.75rem;">${pct}% complete</p>
          <ul class="street-list" id="street-list"></ul>
          <div class="add-street-row">
            <input class="input-field" id="new-street-input" placeholder="Add a street name…" />
            <button class="btn btn-primary" id="add-street-btn">Add</button>
          </div>
        </div>
      </div>
    </div>

    <div>
      <div class="card" style="margin-bottom:1rem;">
        <div class="card-header"><span class="card-title">Area Map</span></div>
        <div class="card-body" style="padding:0.75rem;" id="map-card-body">${mapHTML}</div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">Summary</span></div>
        <div class="card-body">
          <div style="font-size:0.85rem;color:var(--ink-light);line-height:1.8;">
            <div><strong style="color:var(--ink);">Area:</strong> ${area.name}</div>
            ${area.ward        ? `<div><strong style="color:var(--ink);">Ward:</strong> ${area.ward}</div>` : ''}
            ${area.pollingCode ? `<div><strong style="color:var(--ink);">Polling Code:</strong> ${area.pollingCode}</div>` : ''}
            ${area.notes       ? `<div><strong style="color:var(--ink);">Notes:</strong> ${area.notes}</div>` : ''}
            <div id="summary-street"><strong style="color:var(--ink);">Streets:</strong> ${total}</div>
            <div id="summary-completed"><strong style="color:var(--ink);">Completed:</strong> ${done} (${pct}%)</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Attach street input listeners once after DOM is built
  document.getElementById('new-street-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addStreet(id);
  });
  document.getElementById('add-street-btn').addEventListener('click', () => addStreet(id));

  renderStreets(id);
}

function buildMapHTML(area) {
  if (area.mapImageData) {
    return `
      <img src="${area.mapImageData}" class="map-image" alt="Area map" />
      <div class="map-upload-row">
        <label class="map-upload-label">
          ↑ Replace Image
          <input type="file" accept="image/*" onchange="handleMapUpload(event,'${area.id}')" />
        </label>
        <button class="map-remove-btn" onclick="removeMapImage('${area.id}')">Remove</button>
      </div>`;
  }
  return `
    <div class="map-placeholder">
      <svg width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6-10l6-3m0 13l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-1.447-.894L15 10m0-3v13"/>
      </svg>
      <div>No map image</div>
      <div class="map-note">Upload a screenshot or image from your file system</div>
    </div>
    <div class="map-upload-row">
      <label class="map-upload-label">
        ↑ Upload Map Image
        <input type="file" accept="image/*" onchange="handleMapUpload(event,'${area.id}')" />
      </label>
    </div>`;
}

// ===== STREETS =====
function renderStreets(id) {
  const area = areas.find(a => a.id === id);
  const list = document.getElementById('street-list');
  if (!list || !area) return;

  list.innerHTML = '';
  area.streets.forEach((street, si) => {
    const li = document.createElement('li');
    li.className = 'street-item';
    li.innerHTML = `
      <div class="street-check ${street.done ? 'checked' : ''}"></div>
      <span class="street-name ${street.done ? 'done' : ''}">${street.name}</span>
      ${street.notes ? `<span class="street-notes">${street.notes}</span>` : ''}
      <button class="btn btn-danger btn-sm">✕</button>
    `;
    li.querySelector('.street-check').addEventListener('click', () => toggleStreet(id, si));
    li.querySelector('.btn-danger').addEventListener('click', () => removeStreet(id, si));
    list.appendChild(li);
  });

  updateProgress(id);
}

function updateProgress(id) {
  const area = areas.find(a => a.id === id);
  if (!area) return;
  const done  = area.streets.filter(s => s.done).length;
  const total = area.streets.length;
  const pct   = total ? Math.round((done / total) * 100) : 0;

  const bar   = document.getElementById('progress-bar');
  const cnt   = document.getElementById('progress-count');
  const pctEl = document.getElementById('progress-pct');
  const sumEl = document.getElementById('summary-completed');
  const sumST = document.getElementById('summary-street')

  if (bar)   bar.style.width   = pct + '%';
  if (cnt)   cnt.textContent   = `${done}/${total} done`;
  if (pctEl) pctEl.textContent = `${pct}% complete`;
  if (sumEl) sumEl.innerHTML   = `<strong style="color:var(--ink);">Completed:</strong> ${done} (${pct}%)`;
  if (sumST) sumST.innerHTML = `<strong style="color:var(--ink);">Street:</strong> ${total}`;
}

function toggleStreet(areaId, si) {
  const area = areas.find(a => a.id === areaId);
  if (!area) return;
  area.streets[si].done = !area.streets[si].done;
  save();
  renderStreets(areaId);
}

function addStreet(areaId) {
  const input = document.getElementById('new-street-input');
  const name  = input.value.trim();
  if (!name) return;
  const area  = areas.find(a => a.id === areaId);
  if (!area) return;
  area.streets.push({ name, done: false, notes: '' });
  save();
  input.value = '';
  renderStreets(areaId);
}

function removeStreet(areaId, si) {
  const area = areas.find(a => a.id === areaId);
  if (!area) return;
  area.streets.splice(si, 1);
  save();
  renderStreets(areaId);
}

// ===== File-system image upload =====
function handleMapUpload(event, areaId) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const area = areas.find(a => a.id === areaId);
    if (!area) return;
    area.mapImageData = e.target.result;
    save();
    refreshMapCard(areaId);
  };
  reader.readAsDataURL(file);
}

function removeMapImage(areaId) {
  const area = areas.find(a => a.id === areaId);
  if (!area) return;
  delete area.mapImageData;
  save();
  refreshMapCard(areaId);
}

function refreshMapCard(areaId) {
  const area     = areas.find(a => a.id === areaId);
  const cardBody = document.getElementById('map-card-body');
  if (!cardBody || !area) return;
  cardBody.innerHTML = buildMapHTML(area);
}

// ===== AREA ACTIONS =====
function deleteCurrentArea() {
  if (!currentAreaId) return;
  if (!confirm('Delete this area and all its streets?')) return;
  areas = areas.filter(a => a.id !== currentAreaId);
  save();
  navigateToContents();
}

// ===== MODAL =====
function openModal() {
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('input-name').focus(), 50);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['input-name','input-ward','input-polling','input-notes'].forEach(id => {
    document.getElementById(id).value = '';
  });
}

function addArea() {
  const name = document.getElementById('input-name').value.trim();
  if (!name) { document.getElementById('input-name').focus(); return; }
  const ward        = document.getElementById('input-ward').value.trim();
  const pollingCode = document.getElementById('input-polling').value.trim();
  const notes       = document.getElementById('input-notes').value.trim();
  const id          = 'area_' + Date.now();
  areas.push({ id, name, ward, pollingCode, notes, streets: [] });
  save();
  closeModal();
  renderContents();
}

document.getElementById('modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ===== PDF export with date/time filename =====
async function exportAllPDF() {
  if (areas.length === 0) {
    alert('No areas to export. Add some areas first!');
    return;
  }

  const exportBtn = document.getElementById('export-btn');
  exportBtn.textContent = '⏳ Generating…';
  exportBtn.disabled = true;

  // Filename: leaflet-delivery_2025-06-14_14-30.pdf
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const stamp    = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}`;
  const filename = `leaflet-delivery_${stamp}.pdf`;

  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:210mm;';

  // Index page
  const cp = document.createElement('div');
  cp.style.cssText = 'background:white;width:210mm;padding:14mm;box-sizing:border-box;';
  cp.innerHTML = `
    <div style="border-bottom:4px solid #00bed6;padding-bottom:12px;margin-bottom:20px;">
      <h1 style="font-family:sans-serif;font-weight:900;font-size:30px;text-transform:uppercase;color:#0d1f26;line-height:1;">
        Delivery <span style="color:#00bed6;">Area</span> Index
      </h1>
      <p style="font-family:sans-serif;color:#6b8f9a;margin-top:4px;font-size:11px;">
        Leaflet distribution schedule &nbsp;·&nbsp; Exported ${now.toLocaleDateString('en-GB')} at ${now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
      </p>
    </div>
    <table style="width:100%;border-collapse:collapse;font-family:sans-serif;font-size:12px;">
      <thead>
        <tr style="border-bottom:2px solid #00bed6;">
          <th style="text-align:left;padding:5px 7px;color:#6b8f9a;font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:0.08em;">Code</th>
          <th style="text-align:left;padding:5px 7px;color:#6b8f9a;font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:0.08em;">Area / Ward</th>
          <th style="text-align:left;padding:5px 7px;color:#6b8f9a;font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:0.08em;">Streets</th>
          <th style="text-align:left;padding:5px 7px;color:#6b8f9a;font-weight:700;text-transform:uppercase;font-size:9px;letter-spacing:0.08em;">Progress</th>
        </tr>
      </thead>
      <tbody>
        ${areas.map((a) => {
          const d = a.streets.filter(s=>s.done).length;
          const t = a.streets.length;
          const p = t ? Math.round(d/t*100) : 0;
          return `<tr style="border-bottom:1px solid #d0eef2;">
            <td style="padding:7px;color:#00bed6;font-weight:700;font-size:14px;">${a.pollingCode||'—'}</td>
            <td style="padding:7px;font-weight:600;color:#0d1f26;">
              ${a.name}
              ${a.ward  ? `<br><span style="font-weight:400;color:#6b8f9a;font-size:10px;">${a.ward}</span>` : ''}
              ${a.notes ? `<br><span style="font-weight:400;color:#6b8f9a;font-size:10px;font-style:italic;">${a.notes}</span>` : ''}
            </td>
            <td style="padding:7px;color:#2c4a54;">${t}</td>
            <td style="padding:7px;">
              <div style="background:#d0eef2;border-radius:10px;height:5px;width:80px;overflow:hidden;">
                <div style="background:#00bed6;height:100%;width:${p}%;border-radius:10px;"></div>
              </div>
              <span style="color:#6b8f9a;font-size:9px;">${d}/${t} (${p}%)</span>
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>
  `;
  container.appendChild(cp);

  // One page per area
  for (const area of areas) {
    const ap = document.createElement('div');
    ap.style.cssText = 'background:white;width:210mm;min-height:297mm;padding:14mm;box-sizing:border-box;page-break-before:always;';
    const d = area.streets.filter(s=>s.done).length;
    const t = area.streets.length;
    const p = t ? Math.round(d/t*100) : 0;

    const mapSection = area.mapImageData
      ? `<img src="${area.mapImageData}" style="width:100%;border-radius:6px;max-height:160px;object-fit:cover;" alt="Map" />`
      : `<div style="background:linear-gradient(135deg,#e0f9fc,#c8f0f5);border-radius:6px;height:140px;display:flex;align-items:center;justify-content:center;color:#009ab0;font-family:sans-serif;font-size:11px;text-align:center;padding:12px;">No map image set</div>`;

    ap.innerHTML = `
      <div style="border-bottom:4px solid #00bed6;padding-bottom:10px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:flex-end;">
        <div>
          ${area.pollingCode ? `<div style="font-family:sans-serif;font-weight:900;font-size:26px;color:#00bed6;line-height:1;">${area.pollingCode}</div>` : ''}
          <div style="font-family:sans-serif;font-weight:700;font-size:18px;text-transform:uppercase;color:#0d1f26;line-height:1.1;">${area.name}</div>
          ${area.ward  ? `<div style="font-family:sans-serif;font-size:11px;color:#6b8f9a;">${area.ward}</div>` : ''}
          ${area.notes ? `<div style="font-family:sans-serif;font-size:10px;color:#6b8f9a;font-style:italic;">${area.notes}</div>` : ''}
        </div>
        <div style="text-align:right;font-family:sans-serif;">
          <div style="font-size:9px;color:#6b8f9a;text-transform:uppercase;letter-spacing:0.08em;">Progress</div>
          <div style="font-size:20px;font-weight:700;color:#0d1f26;">${p}%</div>
          <div style="font-size:9px;color:#6b8f9a;">${d} of ${t} streets</div>
        </div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 185px;gap:14px;">
        <div>
          <div style="font-family:sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#6b8f9a;margin-bottom:6px;">Streets Checklist</div>
          ${t === 0
            ? '<p style="font-family:sans-serif;color:#6b8f9a;font-size:11px;font-style:italic;">No streets added yet.</p>'
            : area.streets.map(s => `
              <div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #d0eef2;font-family:sans-serif;">
                <div style="width:13px;height:13px;border:2px solid ${s.done?'#00bed6':'#d0eef2'};border-radius:2px;background:${s.done?'#00bed6':'white'};flex-shrink:0;display:flex;align-items:center;justify-content:center;">
                  ${s.done?'<span style="color:white;font-size:8px;font-weight:700;">✓</span>':''}
                </div>
                <span style="font-size:11px;color:${s.done?'#6b8f9a':'#0d1f26'};text-decoration:${s.done?'line-through':'none'};">${s.name}</span>
              </div>`).join('')
          }
        </div>
        <div>
          <div style="font-family:sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#6b8f9a;margin-bottom:6px;">Map</div>
          ${mapSection}
        </div>
      </div>
    `;
    container.appendChild(ap);
  }

  document.body.appendChild(container);

  const opt = {
    margin: 0,
    filename,
    image: { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'] }
  };

  try {
    await html2pdf().set(opt).from(container).save();
  } finally {
    document.body.removeChild(container);
    exportBtn.textContent = '⬇ Export PDF';
    exportBtn.disabled = false;
  }
}
